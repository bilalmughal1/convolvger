[project]
name = "convolvger"
version = "0.4.0"
description = "Local-first, provider-independent archival for public AI conversations"
readme = "README.md"
authors = [
    { name = "Fahad Bilal Saleem", email = "contact@fahadbilal.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "archival",
    "chatgpt",
    "claude",
    "cli",
    "conversations",
    "digital-preservation",
    "gemini",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
convolvger = "convolvger.cli.main:app"

[project.urls]
Homepage = "https://github.com/bilalmughal1/convolvger"
Repository = "https://github.com/bilalmughal1/convolvger"
Issues = "https://github.com/bilalmughal1/convolvger/issues"
Changelog = "https://github.com/bilalmughal1/convolvger/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
# Contract tests call the live provider. They are excluded by default so
# that running the suite never depends on a network, on a share link
# staying published, or on someone else's service being up. The scheduled
# contract workflow selects them explicitly with -m contract.
addopts = "-m 'not contract'"
markers = [
    "contract: verifies a live provider still serves what this version expects",
]
