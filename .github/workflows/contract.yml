name: contract

# Not on push or pull_request. These tests call a live provider, so a
# network hiccup or an outage on Google's side would block work that has
# nothing to do with it. They run on a schedule instead, where a failure
# is a signal about the provider rather than about the change in hand.
on:
  schedule:
    # Mondays, early. Weekly is often enough to catch a format change
    # before a user does, without hammering someone else's service.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-26.04
    steps:
      - name: Which image is this
        run: grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release; uname -r
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # One version is enough: this asks what the provider serves, not
      # what the interpreter does with it.
      - run: uv python install
      - run: uv sync --locked --dev
      - run: uv run pytest -m contract -v
